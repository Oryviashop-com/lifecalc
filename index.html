function applyLang(){

function ymd(b,n){let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}return[y,m,d]}
function nextBd(b,n){let c=new Date(n.getFullYear(),b.getMonth(),b.getDate(),b.getHours(),b.getMinutes());if(c<=n)c=new Date(n.getFullYear()+1,b.getMonth(),b.getDate(),b.getHours(),b.getMinutes());return c}
function stats(n=new Date()){const b=st.birth,ms=n-b,[y,m,d]=ymd(b,n),days=ms/864e5,age=days/365.2425,pct=Math.min(100,age/st.life*100);return{ms,y,m,d,days,age,pct,left:Math.max(0,st.life-age),nb:nextBd(b,n)}}

$('#go').onclick=()=>{
  const v=$('#dob').value,t=$('#tob').value||'00:00';

};
function render(){

  $('#ageSub').textContent=`${f(s.m)} ${tr('m')} ${f(s.d)} ${tr('d')}`;
  $('#pb').style.width=s.pct.toFixed(1)+'%';
  $('#pt').textContent=`${s.pct.toLocaleString(loc(),{maximumFractionDigits:1})}% ${tr('of')} ${tr('done')} • ${s.left.toLocaleString(loc(),{maximumFractionDigits:1})} ${tr('left')}`;

  const M=[...[5e3,1e4,15e3,2e4,25e3].map(d=>({ms:d*864e5,l:`${f(d)} ${tr('days2')}`})),...[1e9,1.5e9].map(x=>({ms:x*1e3,l:st.lang==='bn'?`${f(x/1e7)} ${tr('bil')}`:`${(x/1e9)} ${tr('bil')}`}))].sort((a,b)=>a.ms-b.ms);
  const now=Date.now();
  $('#ml').innerHTML=M.map(m=>{const dt=new Date(st.birth.getTime()+m.ms),p=dt<=now;return`<div class="ms"><span><b>${m.l}</b> <span class="mut">• ${fd(dt)}</span></span><span class="tag ${p?'p':'u'}">${p?tr('pass'):tr('up')}</span></div>`}).join('');
}
function tick(){
  if(!st.birth)return;const n=new Date(),s=stats(n),sec=s.ms/1e3;
  $('#cs').textContent=f(sec);$('#cm').textContent=f(sec/60);$('#ch').textContent=f(sec/3600);$('#cd').textContent=f(s.days);$('#cw').textContent=f(s.days/7);
  $('#cr').textContent=f(s.left*365.2425);
  const r=Math.max(0,s.nb-n);$('#nd').textContent=f(r/864e5);$('#nh').textContent=f(r%864e5/36e5);$('#nmn').textContent=f(r%36e5/6e4);$('#ns').textContent=f(r%6e4/1e3);
}
setInterval(tick,1000);

}

    try{const c=await auth.signInWithEmailAndPassword($('#ae1').value.trim().toLowerCase(),$('#ap').value);
      const d=await fs.doc('admins/'+c.user.uid).get();
      if(!d.exists){$('#ae').innerHTML='এই অ্যাকাউন্ট এডমিন নয়। Firestore-এ <b>admins</b> কালেকশনে নিচের ID দিয়ে ডকুমেন্ট বানান:<br><b style="word-break:break-all">'+esc(c.user.uid)+'</b>';return}
      st.admin=true;buildStudioUI();adminPanel()}
    catch(e){$('#ae').textContent=tr('wrong')+' ('+(e.code||e.message)+')'}};
  $('#al').onclick=go;$('#ap').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function adminPanel(){
  openM(`<h2>⚙️ এডমিন প্যানেল</h2>${st.user?'':'<div class="err">অর্ডার দেখতে/অনুমোদন দিতে আপনার এডমিন অ্যাকাউন্ট দিয়ে লগইন করুন।</div>'}
  <label>বিকাশ নাম্বার (গ্রাহক কপি করবে)</label><div class="row2"><input id="ab" value="${esc(st.bk)}" inputmode="numeric"><button class="sm" id="asv">সেভ</button></div>
  <h3>অর্ডার</h3><div id="ol" class="mut">লোড হচ্ছে…</div>
  <h3>ম্যানুয়াল এক্সেস</h3><input id="gu" placeholder="গ্রাহকের UID"><div class="row" style="margin-top:8px"><button class="sm ok" id="ga">প্রিমিয়াম দিন</button><button class="sm no" id="gr">বাতিল করুন</button></div>`);
  const run=async fn=>{try{await fn();toast('✓')}catch(e){toast(e.code||e.message)}};
  $('#asv').onclick=()=>run(async()=>{await fs.doc('settings/pay').set({bkash:$('#ab').value.trim()});st.bk=$('#ab').value.trim()});
  $('#ga').onclick=()=>run(()=>fs.doc('users/'+$('#gu').value.trim()).set({premium:true},{merge:true}));
  $('#gr').onclick=()=>run(()=>fs.doc('users/'+$('#gu').value.trim()).set({premium:false},{merge:true}));
  async function load(){try{const q=await fs.collection('orders').limit(100).get(),ds=q.docs.map(d=>d.data()).sort((a,b)=>(b.at||0)-(a.at||0));
    $('#ol').innerHTML=ds.length?ds.map(o=>`<div class="od"><b>${esc(o.name)||'—'}</b> • ৳${o.total} • <b>${esc(o.status)}</b><br>নাম্বার: ${esc(o.sender)} • Trx: <b>${esc(o.trx)}</b><br>UID: ${esc(o.uid)}<div class="row" style="margin-top:8px"><button class="sm ok" data-a="ok" data-u="${esc(o.uid)}">অনুমোদন</button><button class="sm no" data-a="no" data-u="${esc(o.uid)}">বাতিল</button></div></div>`).join(''):'কোনো অর্ডার নেই'}catch(e){$('#ol').textContent=(e.code||e.message)}}
  $('#ol').onclick=e=>{const b=e.target.closest('button');if(!b)return;const u=b.dataset.u;run(async()=>{if(b.dataset.a==='ok'){await fs.doc('users/'+u).set({premium:true},{merge:true});await fs.doc('orders/'+u).update({status:'approved'})}else{await fs.doc('users/'+u).set({premium:false},{merge:true});await fs.doc('orders/'+u).update({status:'rejected'})}load()})};
  if(fs)load();
}
$('#mbk').onclick=openAdmin;$('#mbk').onkeydown=e=>{if(e.key==='Enter')openAdmin()};

async function exp(type){
  if(!st.birth)return toast(tr('calcFirst'));
  try{for(const w of[500,600,700])await document.fonts.load(`${w} 40px "Hind Siliguri"`,'আ০১২৩৪৫৬৭৮৯');await document.fonts.ready}catch(e){}
    const cv=document.createElement('canvas');draw(cv,2);const mime=type==='png'?'image/png':'image/jpeg',name=`life-card.${type}`;
  cv.toBlob(b=>{const rd=new FileReader();rd.onload=()=>{const du=rd.result,url=URL.createObjectURL(b),fl=new File([b],name,{type:mime});
    openM(`<h2>✅ ${tr('imgT')}</h2><p class="mut">${tr('imgH')}</p><img class="ex" alt="card" src="${du}"><div class="row"><button class="btn" id="sh">${tr('shr')}</button><button class="btn alt" id="dl">${tr('dl')}</button></div>`);
    $('#sh').onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[fl]})){await navigator.share({files:[fl]});return}}catch(e){if(e&&e.name==='AbortError')return}toast(tr('noShare'))};
    $('#dl').onclick=()=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};
  };rd.readAsDataURL(b)},mime,.95);
}
st.lang=load('lc-lang')||'bn';
setMode(load('lc-mode')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
applyLang();
if(document.fonts)Promise.all([400,500,600,700].map(w=>document.fonts.load(`${w} 20px "Hind Siliguri"`,'আঅabc০১২৩৪৫৬৭৮৯')).concat([document.fonts.load('700 20px "Playfair Display"','Aa'),document.fonts.load('italic 500 20px "Playfair Display"','Aa'),document.fonts.load('700 20px "Tiro Bangla"','আ০১২৩৪৫৬৭৮৯'),document.fonts.load('italic 400 20px "Tiro Bangla"','আ০১২৩৪৫৬৭৮৯')])).then(drawPrev).catch(()=>{});
</script>
